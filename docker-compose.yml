services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudattend_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secure-random-secret-key-capstone-2026
      - DATABASE_PATH=/app/instance/cloudattend.db
      - PORT=5000
    volumes:
      # Named persistent volume to retain SQLite database across container recreations
      - cloudattend_data:/app/instance

volumes:
  cloudattend_data:
    name: cloudattend_sqlite_data

