<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="axAqua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="axMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0ABFC" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>
    <linearGradient id="axGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>
    <filter id="axGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2DD4BF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dynamic Geometric Mortarboard Cap (Top Rhombus) -->
  <polygon points="50,14 88,32 50,50 12,32" fill="url(#axAqua)" filter="url(#axGlow)" />
  <polygon points="50,18 82,32 50,46 18,32" fill="#0B0F14" opacity="0.25" />

  <!-- Tassel Arc and Pearl Bead -->
  <path d="M50,32 Q78,35 84,52" stroke="url(#axMagenta)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="84" cy="54" r="3" fill="#E879F9" />

  <!-- Interlocking Academic 'A' Chevron and Dynamic 'X' / Checkmark Nexus -->
  <!-- Left Leg of X / Ascending Check -->
  <path d="M26,84 L48,56 L40,46" stroke="url(#axAqua)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Leg of X / Power Diagonal -->
  <path d="M74,84 L52,56 L64,42" stroke="url(#axMagenta)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Verified Attendance Checkmark Accent -->
  <path d="M38,66 L48,77 L70,51" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#axGlow)" />
</svg>
